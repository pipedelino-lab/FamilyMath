<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>Family Math</title>
<meta name="theme-color" content="#2563EB"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-title" content="Family Math"/>
<link rel="manifest" href="manifest.json"/>
<style>
  :root{
    --bg:#F3F8FF;--mint:#2B6CB0;--mintsoft:#E8F1FC;--coral:#3B82F6;
    --ok:#16A34A;--bad:#E25555;--text:#1B2A4A;--muted:#5B6B86;--card:#fff;
    --gold:#F5B942;--glow:#7DD3FC;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;min-height:100%}
  body{
    font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    color:var(--text);
    background:
      radial-gradient(1200px 500px at 10% -10%, #D9ECFF 0%, transparent 55%),
      radial-gradient(900px 420px at 110% 8%, #E0F2FE 0%, transparent 50%),
      linear-gradient(180deg,#E8F1FC 0%, #F8FBFF 55%, #EEF6FF 100%);
    background-attachment:fixed;
  }
  body::before,body::after{
    content:"";position:fixed;border-radius:50%;pointer-events:none;z-index:0;
    filter:blur(2px);opacity:.45;
  }
  body::before{
    width:180px;height:180px;left:-40px;top:18%;
    background:radial-gradient(circle,#93C5FD,transparent 70%);
    animation:floaty 9s ease-in-out infinite;
  }
  body::after{
    width:140px;height:140px;right:-30px;bottom:12%;
    background:radial-gradient(circle,#FDE68A,transparent 70%);
    animation:floaty 11s ease-in-out infinite reverse;
  }
  .phone{max-width:430px;margin:0 auto;min-height:100vh;padding:18px 16px 28px;position:relative;z-index:1}
  h1{font-size:26px;margin:8px 0 16px;letter-spacing:-.3px}
  .row{display:flex;align-items:center;gap:8px}
  .muted{color:var(--muted)}
  .card{
    background:#fff;border-radius:20px;padding:16px;margin:0 0 12px;
    box-shadow:0 8px 24px rgba(43,108,176,.08);
    border:1px solid rgba(255,255,255,.8);
    animation:rise .32s ease both;
  }
  .btn{
    border:0;border-radius:14px;padding:14px 16px;width:100%;font-size:17px;font-weight:700;cursor:pointer;
    transition:transform .12s ease, box-shadow .12s ease, filter .12s ease;
    box-shadow:0 6px 14px rgba(43,108,176,.18);
  }
  .btn:active{transform:scale(.97)}
  .coral{background:linear-gradient(180deg,#60A5FA,#2563EB);color:#fff}
  .mint{background:linear-gradient(180deg,#3B82F6,#1D4ED8);color:#fff}
  .ghost{background:#fff;border:1px solid #d5e4f7;color:var(--mint);box-shadow:none}
  .chip{
    background:#fff;border-radius:14px;padding:6px 10px;font-weight:700;
    box-shadow:0 4px 12px rgba(43,108,176,.08);
    animation:pop .35s cubic-bezier(.2,1.4,.3,1) both;
  }
  .opt{
    background:var(--bg);border-radius:14px;padding:14px;margin:8px 0;cursor:pointer;
    transition:transform .12s ease, background .2s ease, box-shadow .2s ease;
  }
  .opt:active{transform:scale(.98)}
  .opt.on{outline:2px solid var(--coral);background:#DBEAFE}
  .opt.good{background:#DCFCE7;outline:2px solid var(--ok);animation:okpulse .45s ease}
  .opt.bad{background:#FEE2E2;outline:2px solid var(--bad);animation:shake .38s ease}
  .bar{height:10px;background:#E2E8F0;border-radius:8px;overflow:hidden}
  .bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,#38BDF8,#2563EB);transition:width .55s ease;border-radius:8px}
  .lang span{margin-left:8px;cursor:pointer;font-weight:700;color:var(--muted);transition:color .15s}
  .lang .on{color:var(--coral);text-decoration:underline}
  input[type=text]{width:100%;padding:14px;border:0;background:var(--bg);border-radius:14px;font-size:18px}
  input[type=text]:focus{outline:2px solid #93C5FD;background:#fff}
  .hidden{display:none}

  .week{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px}
  .wday{flex:1;min-width:42px;border:0;border-radius:14px;padding:10px 0;background:#fff;color:var(--text);font-weight:800;cursor:pointer;transition:transform .12s ease, background .2s}
  .wday .n{font-size:16px;display:block}
  .wday .l{font-size:10px;color:var(--muted);font-weight:600}
  .wday.on{background:linear-gradient(180deg,#3B82F6,#1D4ED8);color:#fff;transform:translateY(-2px);box-shadow:0 8px 16px rgba(37,99,235,.28)}
  .wday.on .l{color:#dbeafe}
  .wday.today:not(.on){outline:2px solid var(--coral)}
  .topic{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #eef3f2;font-size:15px}
  .topic:last-child{border-bottom:0}
  input.pin{letter-spacing:8px;text-align:center;font-size:22px;font-weight:800}

  .avatar{width:56px;height:56px;border-radius:50%;object-fit:cover;background:#dbe7f8;flex-shrink:0;border:2px solid #fff;box-shadow:0 2px 8px rgba(43,108,176,.2);transition:transform .2s}
  .avatar:active{transform:scale(.96)}
  .avatar.lg{width:72px;height:72px}
  .photorow{display:flex;align-items:center;gap:12px}
  input[type=file].hidden{display:none}

  .screen-in{animation:rise .28s ease both}
  .gem{
    width:86px;height:86px;margin:8px auto 14px;border-radius:22px;
    background:linear-gradient(145deg,#7DD3FC,#2563EB 55%,#1E3A8A);
    box-shadow:0 12px 28px rgba(37,99,235,.35), inset 0 2px 8px rgba(255,255,255,.35);
    display:flex;align-items:center;justify-content:center;
    font-size:40px;animation:bounceIn .55s cubic-bezier(.2,1.4,.3,1);
  }
  .burst{
    position:fixed;inset:0;pointer-events:none;z-index:20;
    background:radial-gradient(circle at 50% 30%, rgba(125,211,252,.28), transparent 42%);
    animation:fadeout .7s ease forwards;
  }
  .toast-ok,.toast-bad{
    position:fixed;left:50%;bottom:28px;transform:translateX(-50%);
    padding:10px 16px;border-radius:999px;color:#fff;font-weight:800;z-index:30;
    animation:upfade 1.1s ease forwards;
  }
  .toast-ok{background:#16A34A}
  .toast-bad{background:#DC2626}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @keyframes pop{from{transform:scale(.92)}to{transform:scale(1)}}
  @keyframes shake{0%,100%{transform:none}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
  @keyframes okpulse{0%{transform:scale(.97)}60%{transform:scale(1.02)}100%{transform:scale(1)}}
  @keyframes bounceIn{0%{transform:scale(.4) rotate(-8deg);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1) rotate(0);opacity:1}}
  @keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(18px)}}
  @keyframes fadeout{0%{opacity:1}100%{opacity:0}}
  @keyframes upfade{0%{opacity:0;transform:translate(-50%,10px)}20%{opacity:1;transform:translate(-50%,0)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-8px)}}
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none!important;transition:none!important}
  }
</style>
</head>
<body>
<div class="phone" id="app"></div>
<script>
const BANK = {"chingiz":{"1":{"1":[{"topic":"Уравнения","type":"input","prompt":"Реши уравнение (разминка, как на вступительном):\n3x + 5 = 8x − 10.\nЗапиши только число x.","answer":"3","i18n":{"prompt":{"RU":"Реши уравнение (разминка, как на вступительном):\n3x + 5 = 8x − 10.\nЗапиши только число x.","KK":"3x + 5 = 8x − 10. x мәнін жаз.","EN":"Solve 3x + 5 = 8x − 10. Write x only."},"good":{"RU":"Верно.","KK":"Дұрыс.","EN":"Correct."},"bad":{"RU":"Перенеси 3x вправо: 5 = 5x − 10. Затем +10: 15 = 5x, x = 3.","KK":"15 = 5x, x=3.","EN":"15=5x, x=3."}},"acc":["3","x=3","x = 3"],"id":"c1L1_1"},{"topic":"Уравнения","type":"quiz","prompt":"Раскрой скобки и найди x:\n2(3x + 2) = 5x − 4.","answer":"−8","i18n":{"prompt":{"RU":"Раскрой скобки и найди x:\n2(3x + 2) = 5x − 4.","KK":"2(3x + 2) = 5x − 4. x тап.","EN":"2(3x + 2) = 5x − 4. Find x."},"good":{"RU":"Верно.","KK":"Дұрыс.","EN":"Correct."},"bad":{"RU":"6x + 4 = 5x − 4 → x = −8. Знак +2 внутри скобки даёт +4, не −4.","KK":"x=−8.","EN":"x=−8."},"options":{"RU":["−8","8","−2","2"],"KK":["−8","8","−2","2"],"EN":["−8","8","−2","2"]}},"options":["−8","8","−2","2"],"id":"c1L1_2"},{"topic":"Дроби","type":"input","prompt":"Реши и проверь ОДЗ:\n(x + 21) / (x + 6) = 4.\nОДЗ: x ≠ −6.","answer":"−1","i18n":{"prompt":{"RU":"Реши и проверь ОДЗ:\n(x + 21) / (x + 6) = 4.\nОДЗ: x ≠ −6.","KK":"(x + 21)/(x + 6) = 4, x ≠ −6.","EN":"(x+21)/(x+6)=4, x≠−6."},"good":{"RU":"Верно.","KK":"Дұрыс.","EN":"Correct."},"bad":{"RU":"Домножь на (x+6): x+21=4x+24. 21−24=4x−x, −3=3x, x=−1. ОДЗ x≠−6 — подходит.","KK":"x=−1.","EN":"x=−1."}},"acc":["-1","−1","x=-1","x=−1"],"id":"c1L1_3"},{"topic":"Проценты","type":"input","prompt":"Товар стоил 2000 тг. Цену подняли на 10%. Какая цена стала?","answer":"2200","i18n":{"prompt":{"RU":"Товар стоил 2000 тг. Цену подняли на 10%. Какая цена стала?","KK":"2000 тг, 10% көтерді. Жаңа баға?","EN":"Price 2000, plus 10%. New price?"},"good":{"RU":"Верно.","KK":"Дұрыс.","EN":"Correct."},"bad":{"RU":"Смотри шаги в условии ещё раз.","KK":"Қадамдарды қайта қара.","EN":"Check the steps."}},"acc":["2200","2200 тг"],"id":"c1L1_4"},{"topic":"Геометрия","type":"quiz","prompt":"В треугольнике два угла 50° и 60°. Чему равен третий?","answer":"70°","i18n":{"prompt":{"RU":"В треугольнике два угла 50° и 60°. Чему равен третий?","KK":"Екі бұрыш 50° және 60°. Үшінші?","EN":"Two angles 50° and 60°. Third?"},"good":{"RU":"Верно.","KK":"Дұрыс.","EN":"Correct."},"bad":{"RU":"Сумма углов треугольника 180°. 180−50−60=70.","KK":"180−110=70.","EN":"180−110=70."},"options":{"RU":["70°","110°","90°","80°"],"KK":["70°","110°","90°","80°"],"EN":["70°","110°","90°","80°"]}},"options":["70°","110°","90°","80°"],"id":"c1L1_5"},{"topic":"Движение","type":"input","prompt":"Велосипедист едет 15 км/ч. За сколько часов он проедет 45 км?","answer":"3","i18n":{"prompt":{"RU":"Велосипедист едет 15 км/ч. За сколько часов он проедет 45 км?","KK":"15 км/сағ, 45 км. Неше сағат?","EN":"15 km/h, 45 km. Hours?"},"good":{"RU":"Верно.","KK":"Дұрыс.","EN":"Correct."},"bad":{"RU":"Смотри шаги в условии ещё раз.","KK":"Қадамдарды қайта қара.","EN":"Check the steps."}},"acc":["3","3 ч","3 часа"],"id":"c1L1_6"},{"topic":"Счёт","type":"quiz","prompt":"Какой остаток при делении 100 на 7?","answer":"2","i18n":{"prompt":{"RU":"Какой остаток при делении 100 на 7?","KK":"100-ді 7-ге бөлгенде қалдық?","EN":"Remainder of 100÷7?"},"good":{"RU":"Верно.","KK":"Дұрыс.","EN":"Correct."},"bad":{"RU":"7·14=98, 100−98=2. Остаток меньше делителя.","KK":"98+2=100.","EN":"98+2=100."},"options":{"RU":["2","4","7","14"],"KK":["2","4","7","14"],"EN":["2","4","7","14"]}},"options":["2","4","7","14"],"id":"c1L1_7"},{"topic":"Логика","type":"quiz","prompt":"Аня не рисует. Вера не рисует и не поёт. Три девочки: рисует / поёт / танцует. Чем занимается Вера?","answer":"танцует","i18n":{"prompt":{"RU":"Аня не рисует. Вера не рисует и не поёт. Три девочки: рисует / поёт / танцует. Чем занимается Вера?","KK":"Вера не сурет салады және ән айтпайды. Вера не істейді?","EN":"Vera neither draws nor sings. What does she do?"},"good":{"RU":"Верно.","KK":"Дұрыс.","EN":"Correct."},"bad":{"RU":"Смотри шаги в условии ещё раз.","KK":"Қадамдарды қайта қара.","EN":"Check the steps."},"options":{"RU":["танцует","рисует","поёт","неизвестно"],"KK":["танцует","рисует","поёт","неизвестно"],"EN":["танцует","рисует","поёт","неизвестно"]}},"options":["танцует","рисует","поёт","неизвестно"],"id":"c1L1_8"},{"topic":"Координаты","type":"input","prompt":"Точка A(2; 5). Какая ордината (вторая координата)?","answer":"5","i18n":{"prompt":{"RU":"Точка A(2; 5). Какая ордината (вторая координата)?","KK":"A(2; 5). Ординатасы?","EN":"A(2;5). What is the y-coordinate?"},"good":{"RU":"Верно.","KK":"Дұрыс.","EN":"Correct."},"bad":{"RU":"Смотри шаги в условии ещё раз.","KK":"Қадамдарды қайта қара.","EN":"Check the steps."}},"acc":["5"],"id":"c1L1_9"},{"topic":"Текст","type":"input","prompt":"3 тетради по 200 тг и 2 ручки по 150 тг. Сколько заплатили всего?","answer":"900","i18n":{"prompt":{"RU":"3 тетради по 200 тг и 2 ручки по 150 тг. Сколько заплатили всего?","KK":"3 дәптер 200, 2 қалам 150. Барлығы?","EN":"3 notebooks 200 and 2 pens 150. Total?"},"good":{"RU":"Верно.","KK":"Дұрыс.","EN":"Correct."},"bad":{"RU":"Смотри шаги в условии ещё раз.","KK":"Қадамдарды қайта қара.","EN":"Check the steps."}},"acc":["900"],"id":"c1L1_10"},{"topic":"Степени","type":"quiz","prompt":"Последняя цифра числа 4³?","answer":"4","i18n":{"prompt":{"RU":"Последняя цифра числа 4³?","KK":"4³ соңғы цифры?","EN":"Last digit of 4³?"},"good":{"RU":"Верно.","KK":"Дұрыс.","EN":"Correct."},"bad":{"RU":"4¹→4, 4²→6, 4³→4. Цикл 4,6. Нечётная степень — 4.","KK":"4.","EN":"4."},"options":{"RU":["4","6","2","8"],"KK":["4","6","2","8"],"EN":["4","6","2","8"]}},"options":["4","6","2","8"],"id":"c1L1_11"},{"topic":"Многочлены","type":"input","prompt":"Раскрой: −2(x − 5). Ответ в виде ax+b без пробелов, например -2x+10.","answer":"−2x+10","i18n":{"prompt":{"RU":"Раскрой: −2(x − 5). Ответ в виде ax+b б function t(k){ return (I18N[S.lang]||I18N.RU)[k] || I18N.RU[k] || k; }
function Lname(lv){ return t(LEVELS[lv]||"lyceum"); }
function monthName(m){ return (MONTHS[S.lang]||MONTHS.RU)[m-1]; }
function weekNames(){ return WEEK[S.lang]||WEEK.RU; }
function pad(n){ return String(n).padStart(2,"0"); }
function daysInMonth(y,m){ return new Date(y,m,0).getDate(); }
function isoDate(y,m,d){ return y+"-"+pad(m)+"-"+pad(d); }
function packDay(y,m,d){
  const start = Date.UTC(y,0,1);
  const cur = Date.UTC(y,m-1,d);
  const doy = Math.floor((cur-start)/86400000)+1;
  return ((doy-1)%30)+1;
}
function nowClock(){
  const n=new Date();
  return pad(n.getHours())+":"+pad(n.getMinutes())+":"+pad(n.getSeconds());
}
function fmtHuman(y,m,d){ return d+" "+monthName(m)+" "+y; }
function loadLevels(){ try { return JSON.parse(localStorage.getItem("fm_levels")||"{}"); } catch(e){ return {}; } }
function saveLevels(o){ localStorage.setItem("fm_levels", JSON.stringify(o)); }
function loadLog(){ try { return JSON.parse(localStorage.getItem("fm_log")||"{}"); } catch(e){ return {}; } }
function saveLog(o){ localStorage.setItem("fm_log", JSON.stringify(o)); }
function pushLog(who, rec){
  const log = loadLog();
  if(!log[who]) log[who] = [];
  log[who].push(rec);
  if(log[who].length > 800) log[who] = log[who].slice(-800);
  saveLog(log);
}
function loadRetry(){ try { return JSON.parse(localStorage.getItem("fm_retry")||"{}"); } catch(e){ return {}; } }
function saveRetry(o){ localStorage.setItem("fm_retry", JSON.stringify(o)); }
function addRetry(who, item){
  const o=loadRetry();
  if(!o[who]) o[who]=[];

    b.onclick=()=>{ S.m=m; const dim=daysInMonth(S.y,S.m); if(S.d>dim)S.d=dim; S.i=0;S.results=[];S.points=0; render(); };
    months.append(b);
  }
  box.append(months);
  const grid=$("div",{style:"display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center"});
  weekNames().forEach(w=>grid.append($("div",{className:"muted",textContent:w,style:"font-size:12px"})));
  const first = new Date(S.y,S.m-1,1);
  let start = first.getDay();
  start = start===0?6:start-1;
  for(let i=0;i<start;i++) grid.append($("div",{textContent:""}));
  const dim=daysInMonth(S.y,S.m);
  const today=new Date();
  for(let d=1;d<=dim;d++){
    const cell=$("button",{className:"chip",textContent:String(d),style:"width:100%;padding:8px 0"});
    const isSel=d===S.d;
    const isToday=d===today.getDate() && S.m===today.getMonth()+1 && S.y===today.getFullYear();
    cell.style.background = isSel ? "var(--mint)" : "#fff";
    cell.style.color = isSel ? "#fff" : "inherit";
    if(isToday && !isSel) cell.style.outline="2px solid var(--coral)";
    cell.onclick=()=>{S.d=d;S.i=0;S.results=[];S.points=0;S.view="home";render()};
    grid.append(cell);
  }
  box.append(grid);
  const jump=$("button",{className:"btn ghost",textContent:t("gotoToday"),style:"margin-top:10px"});
  jump.onclick=()=>{ const n=new Date(); S.y=n.getFullYear(); S.m=n.getMonth()+1; S.d=n.getDate(); S.i=0;S.results=[];S.points=0; render(); };
  box.append(jump);
  return box;
}

function deviceSetup(root){
  root.append(langBar());
  root.append($("h1",{textContent:t("whose")}));
  root.append($("p",{className:"muted",textContent:t("onlyone")}));
  [["chingiz",t("chingiz")],["tamina",t("tamina")]].forEach(([id,n])=>{
    const c=$("div",{className:"card"});
    c.append($("b",{textContent:n}));
    const inp=$("input",{className:"pin",maxLength:4,inputMode:"numeric",placeholder:t("setcode")});
    c.append(inp);
    const b=$("button",{className:"btn mint",textContent:t("lock"),style:"margin-top:10px"});
    b.onclick=()=>{
      const code=(inp.value||"").replace(/\D/g,"").slice(0,4);
      localStorage.setItem("fm_device", id);
      if(code.length===4) localStorage.setItem("fm_code_"+id, code);
      S.device=id; S.profile=id; S.view="home"; render();
    };
    c.append(b);
    root.append(c);
  });
  const p=$("div",{className:"card"});
  p.innerHTML=`<b>${t("parents")}</b><div class="muted">${t("ctrl")}</div>`;
  p.onclick=()=>{ localStorage.setItem("fm_device","shared"); S.device="shared"; S.profile="parents"; render(); };
  root.append(p);
}
function profiles(root){
  root.append(langBar());
  root.append($("div",{className:"muted",textContent:t("fm"),style:"font-weight:700;color:var(--mint);margin-top:8px"}));
  root.append($("h1",{textContent:t("who")}));
  const list = S.device==="shared"
    ? [["chingiz",t("chingiz"),t("g7")],["tamina",t("tamina"),t("g3")],["parents",t("parents"),t("ctrl")]]
    : S.device==="tamina"
      ? [["tamina",t("tamina"),t("g3")],["parents",t("parents"),t("ctrl")]]
      : [["chingiz",t("chingiz"),t("g7")],["parents",t("parents"),t("ctrl")]];
  list.forEach(([id,n,sub])=>{
    const c=$("div",{className:"card"});
    const row=$("div",{className:"photorow"});
    row.append(avatarEl(id));
    const txt=$("div",{style:"flex:1"});
    txt.innerHTML=`<b style="font-size:18px">${n}</b><div class="muted">${sub}</div>`;
    row.append(txt);
    if(id!=="parents"){
      const add=$("button",{className:"chip",textContent:getPhoto(id)?t("photo"):t("photo")});
      add.onclick=e=>{ e.stopPropagation(); pickPhoto(id); };
      row.append(add);
    }
    c.append(row);
    c.onclick=()=>{
      if(id==="parents"){ S.profile="parents"; S.parentOk=false; S.pinTry=""; S.pinErr=false; render(); return; }
      const need=localStorage.getItem("fm_code_"+id)||"";
      if(need && S.childCode!==need){
        const ask=prompt(t("entercode"));
        if((ask||"").replace(/\D/g,"")!==need) return;
        S.childCode=need;
      }
      S.profile=id;S.i=0;S.results=[];S.view="home";S.points=0;S.pick=null;S.checked=false;render();
    };
    root.append(c);
  });
  const sw=$("button",{className:"btn ghost",textContent:t("switch")});
  sw.onclick=()=>{
    const pin=localStorage.getItem("fm_pin")||"";
    if(pin){
      const ask=prompt(t("pinenter"));
      if(ask!==pin) return;
    }
    localStorage.removeItem("fm_device"); S.device=""; S.profile=null; render();
  };
  root.append(sw);
}
function home(root){
  const name=S.profile==="tamina"?t("tamina"):t("chingiz");
  const who=whoKey();
  const all=tasks();
  const doneN=S.results.length;
  S.streak = computeStreak(who);
  const back=$("button",{className:"ghost btn",textContent:t("back"),style:"width:auto;margin-bottom:10px"});
  back.onclick=()=>{S.profile=null;render()};
  root.append(back);
  root.append(langBar());
  const top=$("div",{className:"row",style:"flex-wrap:wrap"});
  const left=$("div",{className:"photorow",style:"flex:1"});
  const av=avatarEl(who,true);
  av.style.cursor="pointer";
  av.onclick=()=>pickPhoto(who);
  left.append(av);
  const names=$("div");
  names.innerHTML=`<div class="muted">${t("today")}, ${fmtHuman(S.y,S.m,S.d)}</div><h1 style="margin:0">${t("hello")}, ${name}</h1>`;
  left.append(names);
  top.append(left);
  top.append($("div",{className:"chip",textContent:"🔥 "+S.streak+" "+t("daysrow")}));
  top.append($("div",{className:"chip",textContent:"⭐ "+S.points+" "+t("points")}));
  root.append(top);
  root.append(weekStrip());
  const card=$("div",{className:"card",style:"background:var(--mintsoft)"});
  const pct=all.length?Math.round(doneN/all.length*100):0;
  card.innerHTML=`<div class="muted">${all.length} ${t("tasks")} · ${Lname(S.levels[who]||2)}</div>
    <div style="font-size:32px;font-weight:800">${doneN}/${all.length}</div>
    <div class="bar"><i style="width:${pct}%"></i></div>`;
  root.append(card);
  root.append(topicList(all));
  if(S._retryN){
    root.append($("div",{className:"muted",style:"margin:0 0 10px",textContent:t("retryttl")+" · "+S._retryN}));
  }
  const mast=topicMastery(who);
  if(mast.length){
    const box=$("div",{className:"card"});
    box.append($("div",{className:"muted",textContent:t("mastery")}));
    mast.slice(0,5).forEach(x=>{
      const tag=x.pct>=80?t("strongok"):x.pct>=55?t("midok"):t("weakok");
      const row=$("div",{className:"topic"});
      row.innerHTML="<span>"+x.topic+"</span><span class=\"muted\">"+x.pct+"% · "+tag+"</span>";
      box.append(row);
    });
    root.append(box);
  }
  root.append(calendarBox());
  const ctrl=$("div",{className:"card"});
  ctrl.append($("div",{className:"muted",textContent:t("diff")}));
  ctrl.append(levelRow(who));
  if(failHeavy() && (S.levels[who]||2)>1){
    ctrl.append($("div",{style:"margin-top:10px;color:var(--bad);font-weight:700",textContent:t("manyerr")}));
  }
  root.append(ctrl);
  const st=$("button",{className:"btn ghost",textContent:t("stats"),style:"margin-bottom:8px"});
  st.onclick=()=>{S.view="stats";render()};
  root.append(st);
  const b=$("button",{className:"btn coral",textContent:doneN?t("cont"):t("start")});
  b.disabled=doneN>=all.length;
  b.onclick=()=>{
    consumeRetry(whoKey(), isoDate(S.y,S.m,S.d), S._retryN||0);
    S.view="task";S.pick=null;S.checked=false;S.hint=false;S.showHint=false;render();
  };
  root.append(b);
}
function task(root){
  const all=tasks();
  if(S.i>=all.length){S.view="done";return render()}
  const item=all[S.i];
  const head=$("div",{className:"row"});
  head.innerHTML=`<b>${S.i+1}/${all.length}</b><span class="muted" style="margin-left:auto">${fmtHuman(S.y,S.m,S.d)}</span>`;
  root.append(head);
  root.append($("div",{className:"muted",textContent:topicName(item)+(item.hard?t("hardtag"):""), style:"margin-bottom:8px"}));
  const card=$("div",{className:"card"});
  const pr=$("div",{style:"font-size:18px;font-weight:700;margin-bottom:10px;white-space:pre-wrap;line-height:1.35"}); pr.textContent=fullPrompt(item); card.append(pr);
  if(item.type==="quiz"){
    (item.options||[]).forEach(o=>{
      const d=$("div",{className:"opt",textContent:o});
      if(!S.checked && S.pick===o) d.classList.add("on");
      if(S.checked && String(o)===String(item.answer)) d.classList.add("good");
      if(S.checked && S.pick===o && !S.ok) d.classList.add("bad");
      d.onclick=()=>{if(S.checked)return;S.pick=o;render()};
      card.append(d);
    });
  } else {
    const inp=$("input"); inp.type="text"; inp.placeholder=t("ans"); inp.value=S.pick||"";
    inp.disabled=S.checked;
    inp.oninput=e=>S.pick=e.target.value;
    card.append(inp);
  }
  root.append(card);
  if(S.showHint && !S.checked){
    const hi=$("div",{className:"card",style:"background:#fff7e8"});
    hi.innerHTML="<b>"+t("hintttl")+"</b><div style=\"margin-top:8px;line-height:1.45\">"+hintText(item)+"</div>";
    root.append(hi);
  }
  if(S.checked){
    const box=$("div",{className:"card",style:"background:var(--mintsoft)"});
    box.innerHTML=`<b style="color:${S.ok?"var(--ok)":"var(--bad)"}">${S.ok?t("ok"):t("almost")}</b>
      <div style="margin-top:8px;line-height:1.4">${S.ok?loc(item,"good"):loc(item,"bad")}</div>`;
    root.append(box);
    const n=$("button",{className:"btn coral",textContent:t("next")});
    n.onclick=()=>{S.i++;S.pick=null;S.checked=false;S.hint=false;S.showHint=false;S.ok=false;S.hintLevel=0;render()};
    root.append(n);
  } else {
    const p=$("button",{className:"btn mint",textContent:t("check")});
    p.onclick=()=>{
      const given=S.pick||"";
      if(!String(given).trim()) return;
      S.ok=okAns(item,given);
      S.checked=true;
      S.results.push({ok:S.ok,topic:item.topic,hint:S.hint});
      const n=new Date();
      pushLog(whoKey(), {date:isoDate(S.y,S.m,S.d), time:pad(n.getHours())+":"+pad(n.getMinutes()), topic:item.topic, ok:S.ok, hint:S.hint, lv:S.levels[whoKey()], t:Date.now()});
      if(!S.ok) addRetry(whoKey(), item);
      if(S.ok && !S.hint) S.points += item.type==="input"?12:10;
      else if(S.ok) S.points += 5;
      ping(S.ok);
      render();
    };
    const hb=$("button",{className:"btn ghost",textContent:S.showHint?t("hintmore"):t("hintbtn"),style:"margin-top:8px"});
    hb.onclick=()=>{ S.hint=true; S.showHint=true; S.hintLevel=(S.hintLevel||0)+1; if(S.hintLevel>3) S.hintLevel=3; render(); };
    const h=$("button",{className:"btn ghost",textContent:t("idk"),style:"margin-top:8px"});
    h.onclick=()=>{
      S.hint=true;S.ok=false;S.checked=true;
      S.results.push({ok:false,topic:item.topic,hint:true});
      addRetry(whoKey(), item);
      const n=new Date();
      pushLog(whoKey(), {date:isoDate(S.y,S.m,S.d), time:pad(n.getHours())+":"+pad(n.getMinutes()), topic:item.topic, ok:false, hint:true, lv:S.levels[whoKey()], t:Date.now()});
      render();
    };
    root.append(p); root.append(hb); root.append(h);
  }
}
function done(root){
  const ok=S.results.filter(r=>r.ok).length;
  const weak=[...new Set(S.results.filter(r=>!r.ok).map(r=>r.topic))];
  const gem=$("div",{className:"gem",textContent:ok>=(S.results.length*0.8)?"💎":"🔷"});
  root.append(gem);
  root.append($("h1",{textContent:fmtHuman(S.y,S.m,S.d)+" · "+t("closed"),style:"text-align:center"}));
  root.append($("p",{textContent:`${t("right")} ${ok} / ${S.results.length}`}));
  root.append($("p",{textContent:`${t("pts")}: ${S.points}`}));
  if(weak.length) root.append($("p",{textContent:t("weak")+": "+weak.join(", ")}));
  const nx=$("button",{className:"btn coral",textContent:t("nextd")});
  nx.onclick=()=>{
    S.d++;
    const dim=daysInMonth(S.y,S.m);
    if(S.d>dim){ S.d=1; S.m++; if(S.m>12){S.m=1;S.y++;} }
    S.i=0;S.results=[];S.points=0;S.view="home";
    render();
  };
  root.append(nx);
  const gs=$("button",{className:"btn ghost",textContent:t("stats"),style:"margin-top:8px"});
  gs.onclick=()=>{S.view="stats";render()};
  root.append(gs);
}
function barsFor(who, nDays){
  const log=(loadLog()[who]||[]);
  const map={};
  log.forEach(r=>{
    const k=r.date || String(r.day);
    if(!map[k]) map[k]={ok:0,n:0};
    map[k].n++; if(r.ok) map[k].ok++;
  });
  const out=[];
  const cur=new Date(S.y,S.m-1,S.d);
  for(let i=nDays-1;i>=0;i--){
    const dt=new Date(cur); dt.setDate(cur.getDate()-i);
    const k=isoDate(dt.getFullYear(),dt.getMonth()+1,dt.getDate());
    const v=map[k]||{ok:0,n:0};
    out.push({k, label:dt.getDate()+"."+String(dt.getMonth()+1).padStart(2,"0"), ok:v.ok, n:v.n, pct:v.n?Math.round(v.ok/v.n*100):0});
  }
  return out;
}
function drawBars(rows){
  const wrap=$("div",{style:"display:flex;align-items:flex-end;gap:6px;height:140px;padding-top:8px"});
  const max=Math.max(1,...rows.map(r=>r.n));
  rows.forEach(r=>{
    const col=$("div",{style:"flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%"});
    const h=Math.max(4, Math.round(r.n/max*100));
    const bar=$("div",{style:`width:100%;height:${h}%;border-radius:8px 8px 4px 4px;background:${r.n? "var(--mint)":"#d7e3e0"}`});
    if(r.n && r.pct<60) bar.style.background="var(--coral)";
    col.append(bar);
    col.append($("div",{className:"muted",style:"font-size:10px;margin-top:4px",textContent:r.label}));
    wrap.append(col);
  });
  return wrap;
}
function stats(root){
  const who=whoKey();
  const name=S.profile==="tamina"?t("tamina"):t("chingiz");
  const back=$("button",{className:"ghost btn",textContent:t("back"),style:"width:auto;margin-bottom:10px"});
  back.onclick=()=>{S.view="home";render()};
  root.append(back);
  root.append($("h1",{textContent:t("stats")}));
  root.append($("p",{className:"muted",textContent:name+" · "+fmtHuman(S.y,S.m,S.d)}));
  const st=kidStats(who);
  const card=$("div",{className:"card",style:"background:var(--mintsoft)"});
  const pct=st.totalN?Math.round(st.totalOk/st.totalN*100):0;
  card.innerHTML=`<div class="muted">${t("total")}</div><div style="font-size:28px;font-weight:800">${st.totalOk}/${st.totalN||0}</div>
    <div class="muted">${t("acc")}: ${pct}% · 🔥 ${computeStreak(who)}</div>`;
  root.append(card);
  const w=$("div",{className:"card"});
  w.append($("b",{textContent:t("week")}));
  const week=barsFor(who,7);
  if(week.every(r=>r.n===0)) w.append($("div",{className:"muted",style:"margin-top:8px",textContent:t("emptyg")}));
  else w.append(drawBars(week));
  root.append(w);
}
function kidCard(root, id, title, quota){
  const st = kidStats(id);
  const c=$("div",{className:"card"});
  c.append($("b",{textContent:title+" · "+quota+" "+t("always")}));
  c.append($("div",{className:"muted",textContent:t("level")+": "+Lname(S.levels[id]||2)+" · 🔥 "+computeStreak(id)}));
  if(!st.totalN){
    c.append($("div",{className:"muted",style:"margin-top:8px",textContent:t("nosol")}));
  } else {
    const pct = Math.round(st.totalOk/st.totalN*100);
    c.append($("div",{style:"margin-top:8px;font-weight:800",textContent:`${t("total")} ${st.totalOk}/${st.totalN} · ${pct}%`}));
    if(st.last){
      const d = st.days[st.last];
      c.append($("div",{className:"muted",textContent:`${t("last")} ${st.last}${d.lastTime?" · "+d.lastTime:""}: ${d.ok}/${d.n}`}));
      const weak = Object.entries(d.weak).sort((a,b)=>b[1]-a[1]).map(x=>x[0]);
      if(weak.length) c.append($("div",{style:"color:var(--bad);margin-top:4px",textContent:t("weak")+": "+weak.join(", ")}));
    }
  }
  c.append(levelRow(id));
  root.append(c);
}
function parents(root){
  const back=$("button",{className:"ghost btn",textContent:t("back"),style:"width:auto"});
  back.onclick=()=>{S.profile=null;S.parentOk=false;render()};
  root.append(back);
  root.append(langBar());
  const pin=getPin();
  if(!S.parentOk){
    root.append($("h1",{textContent:t("parents")}));
    const box=$("div",{className:"card"});
    box.append($("p",{className:"muted",textContent:pin?t("pinenter"):t("pinhint")}));
    const inp=$("input",{className:"pin",maxLength:4,inputMode:"numeric",placeholder:"••••"});
    inp.value=S.pinTry||"";
    inp.oninput=e=>{S.pinTry=e.target.value.replace(/\D/g,"").slice(0,4)};
    box.append(inp);
    if(S.pinErr) box.append($("div",{style:"color:var(--bad);margin-top:8px",textContent:t("pinbad")}));
    const go=$("button",{className:"btn mint",textContent:pin?t("pinok"):t("pinsave"),style:"margin-top:12px"});
    go.onclick=()=>{
      const v=(S.pinTry||"").replace(/\D/g,"");
      if(v.length!==4){ S.pinErr=true; render(); return; }
      if(!pin){ setPin(v); S.parentOk=true; S.pinErr=false; render(); return; }
      if(v===pin){ S.parentOk=true; S.pinErr=false; render(); }
      else { S.pinErr=true; render(); }
    };
    box.append(go);
    root.append(box);
    return;
  }
  root.append($("h1",{textContent:t("parents")}));
  root.append($("p",{className:"muted",textContent:t("note")}));
  kidCard(root,"chingiz",t("chingiz"),12);
  kidCard(root,"tamina",t("tamina"),10);
  const box=$("div",{className:"card",style:"background:var(--mintsoft)"});
  box.append($("b",{textContent:t("repweek")}));
  const txt=weekReport("chingiz")+"\n"+weekReport("tamina");
  box.append($("div",{style:"margin-top:8px;white-space:pre-wrap;line-height:1.45",textContent:txt}));
  const copy=$("button",{className:"btn mint",textContent:t("share"),style:"margin-top:12px"});
  copy.onclick=()=>{
    if(navigator.share) navigator.share({text:txt}).catch(()=>{});
    else { navigator.clipboard.writeText(txt).catch(()=>{}); alert(txt); }
  };
  box.append(copy);
  root.append(box);
}
if("serviceWorker" in navigator){
  navigator.serviceWorker.register("./sw.js").catch(()=>{});
}
render();
</script>
